project_id = "personal-intelligence-loop"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
# preview(npm run preview)는 127.0.0.1:3100에서 실행됩니다. 브라우저 주소와 APP_ORIGIN의 호스트가 같아야 로그인 쿠키가 유지됩니다.
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback", "http://localhost:3100/auth/callback", "http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
