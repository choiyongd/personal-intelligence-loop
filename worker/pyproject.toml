[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "pil-worker"
version = "0.1.0"
description = "Policy-gated, idempotent RSS/API ingestion worker"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2.6,<4", "defusedxml>=0.7.1,<1", "python-dotenv>=1.0.1,<2"]
[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
[project.scripts]
pil-worker = "pil_worker.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
pil_worker = ["fixtures/*.xml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
